spring.application.name=mt-saas-backend-clean

# Database - Production settings
spring.datasource.url=${DATABASE_URL}

# Validate schema without making unsafe automatic structure changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ==========================================
# HikariCP Connection Pool (Neon Scale-to-Zero)
# ==========================================
spring.datasource.hikari.maximum-pool-size=2
# Allow pool to drop to 0 connections when idle so Neon can sleep
spring.datasource.hikari.minimum-idle=0
# Close idle connections at 4 minutes (before Neon's 5-minute scale-to-zero timer)
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000

# Lemon Squeezy - Production keys
lemon-squeezy.api-key=${LEMON_SQUEEZY_API_KEY}
lemon-squeezy.webhook.secret=${LEMON_SQUEEZY_WEBHOOK_SECRET}
lemon-squeezy.store-id=${LEMON_SQUEEZY_STORE_ID}
lemon-squeezy.variant.starter=${LEMON_SQUEEZY_VARIANT_STARTER}
lemon-squeezy.variant.professional=${LEMON_SQUEEZY_VARIANT_PRO}
lemon-squeezy.variant.enterprise=${LEMON_SQUEEZY_VARIANT_ENTERPRISE}

# Logging
logging.level.com.mtsaas=WARN
logging.level.org.springframework=WARN

# Frontend
app.frontend.url=${FRONTEND_URL}

# OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
#spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.redirect-uri=https://swiftbackend-production.up.railway.app/login/oauth2/code/google

# JWT
app.jwt.secret-key=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:1209600000}
app.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh_token}
app.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:true}
app.jwt.refresh-cookie-same-site=${JWT_REFRESH_COOKIE_SAME_SITE:None}


# Email Configuration - Using Resend API
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL}
